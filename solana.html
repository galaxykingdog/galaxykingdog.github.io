  <script>
    (() => {
      const button = document.getElementById("btn-player-name");
      if (!button) return;

      function refreshPlayerName() {
        const name = window.GKDPlayerName?.get?.() || "ANON";
        button.textContent = `Player: ${name}`;
      }

      button.addEventListener("click", async () => {
        if (!window.GKDPlayerName?.choose) return;
        button.disabled = true;
        try {
          await window.GKDPlayerName.choose();
        } finally {
          button.disabled = false;
          refreshPlayerName();
        }
      });
      window.addEventListener("gkd:player-name-changed", refreshPlayerName);
      refreshPlayerName();
    })();
  </script>
